<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      document.documentElement.dataset.theme = localStorage.getItem("theme") || "dark";
    </script>
    <title>Lender — Ops Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="side-nav">
        <div class="brand">
          <img src="/assets/jifiti-logo-navy.png" alt="Jifiti" class="brand-logo brand-logo-light" />
          <img src="/assets/jifiti-logo-white.png" alt="Jifiti" class="brand-logo brand-logo-dark" />
          <span>Ops Dashboard</span>
        </div>
        <nav class="side-nav-links">
          <a href="/overview">
            <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
            Overview
          </a>
          <a href="/">
            <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h7l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M13 3v5h5"/><path d="M9 13h6M9 17h6"/></svg>
            Reports
          </a>
          <a href="/analytics">
            <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="20" x2="5" y2="11"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="19" y1="20" x2="19" y2="14"/><line x1="3" y1="20" x2="21" y2="20"/></svg>
            Analytics
          </a>
          <a href="/lenders">
            <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M4 21V10l8-6 8 6v11"/><path d="M9 21v-6h6v6"/></svg>
            Lenders
          </a>
          <a href="/fullstory">
            <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10.5 9.2v5.6l4.7-2.8z" fill="currentColor" stroke="none"/></svg>
            FullStory
          </a>
          <a href="/admin" id="admin-nav-link" style="display: none">
            <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20v-1.5a3.5 3.5 0 0 0-3.5-3.5h-5A3.5 3.5 0 0 0 4 18.5V20"/><circle cx="9" cy="8" r="3.2"/><path d="M20 20v-1.3a3.2 3.2 0 0 0-2.2-3"/><path d="M14.5 4.8a3.2 3.2 0 0 1 0 6.1"/></svg>
            Admin
          </a>
          <a href="/activity" id="activity-nav-link" style="display: none">
            <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
            Activity
          </a>
          <a href="/security">
            <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l6.5 2.6v5.4c0 4.4-2.8 7.6-6.5 8.9-3.7-1.3-6.5-4.5-6.5-8.9V6.1z"/><path d="M9 12.3l2 2 4-4.2"/></svg>
            Security
          </a>
        </nav>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div class="topbar-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M4 21V10l8-6 8 6v11"/><path d="M9 21v-6h6v6"/></svg>
            <span id="lender-title">Loading…</span>
          </div>
          <div class="topbar-user">
            <button class="cmdk-trigger" id="cmdk-trigger" type="button">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
              <span>Search</span>
              <kbd>Ctrl K</kbd>
            </button>
            <button class="theme-toggle-btn" id="theme-toggle" type="button" title="Toggle light/dark theme" aria-label="Toggle light/dark theme">
              <svg class="theme-icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
              <svg class="theme-icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            </button>
            <div class="user-chip">
              <div class="avatar" id="user-initials">··</div>
              <span id="user-email"></span>
            </div>
            <button class="link-btn" id="logout-btn">Sign out</button>
          </div>
        </header>

        <div class="page">
          <p class="subtitle" style="margin-bottom: 18px"><a href="/lenders">← All lenders</a></p>

          <div class="card" id="not-found-card" style="display: none">
            <p class="empty-state" id="not-found-message">This lender isn't recognized, or you don't have access to it.</p>
          </div>

          <div id="lender-content" style="display: none">
            <div class="card">
              <h3>Reports</h3>
              <div id="lender-reports-body"></div>
            </div>

            <div class="card">
              <h3>Analytics (last 30 days)</h3>
              <div id="lender-analytics-body"></div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="/assets/api.js"></script>
    <script src="/assets/command-palette.js"></script>
    <script src="/assets/sortable-table.js"></script>
    <script src="/assets/app.js"></script>
    <script src="/assets/lender.js"></script>
    <script>
      initHeader();
    </script>
  </body>
</html>
